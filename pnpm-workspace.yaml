allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

# SECURITY OVERRIDES -- transitive patch bumps, not feature upgrades.
#
# `pnpm audit --audit-level high` is a CI gate (.github/workflows/ci.yml) and
# SECURITY.md § 11 makes dependency scanning a release gate, so a high sitting
# in the tree is a red build on every PR until it is dealt with. Both of these
# arrive through packages we do not depend on directly -- sharp via next,
# js-yaml via eslint -- so there is no direct version to raise.
#
#   sharp   <0.35.4 -- libheif GHSA-g89c-p67h-r497 / GHSA-2jg2-4ch7-h545
#           <0.35.5 -- librsvg CVE-2026-96889 (2026-10-15)
#   js-yaml <4.3.2  -- GHSA-2883-xcg3-v3hh, CPU use on empty merge sources
#   source-map-js <1.2.2 -- event-loop DoS (via next>postcss, @tailwindcss/node)
#   brace-expansion <1.1.20 / 4.x <5.0.11 -- recursion DoS (via eslint's and
#           typescript-estree's minimatch); one entry per major so neither
#           line is dragged across a major boundary
#   vite    7.0.0-7.3.6 -- launch-editor advisories (one high, two moderate),
#           patched in 7.3.7. Arrives through vitest (dev-only test runner).
#
# Both are patch bumps inside the same minor, which is why an override is the
# proportionate tool here rather than waiting on the parents to re-release.
#
# THE RANGES ARE CARET-PINNED, NOT ">=", AND THAT MATTERS. A ">=4.3.2" on
# js-yaml resolved to 5.4.1 -- a major version, with whatever breaking changes
# v5 carries, silently substituted underneath eslint. An override is a
# statement about which PATCH is safe, so it must not be able to cross a major
# boundary on its own.
# Remove an entry once its parent ships a version that resolves past it on its
# own -- an override that no longer changes anything is a lie about the tree.
overrides:
  sharp: "^0.35.5"
  js-yaml: "^4.3.2"
  source-map-js: "^1.2.2"
  "brace-expansion@<2": "^1.1.20"
  "brace-expansion@>=4 <6": "^5.0.11"
  "vite@>=7 <8": "^7.3.7"

# AUDIT EXCEPTIONS -- each one has NO published fix, is dev-only, and says why
# it cannot be reached. Delete the entry the day a patched version ships (the
# override list above is then the right tool).
#
#   GHSA-vfj7-8cjw-p6xm  braces <=3.0.3, stack-exhaustion DoS on deeply nested
#     patterns; no patched release (2026-10-15). Only path:
#     eslint-config-next > @next/eslint-plugin-next > fast-glob > micromatch.
#     Dev-only lint tooling: the patterns it expands are this repo's own lint
#     config globs, never user input, and nothing in the shipped app imports it.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
