# ClamAV for upload scanning (Q42). Local:  docker compose -f docker/clamav/compose.yml up -d
# then set MALWARE_SCANNER=clamav and CLAMAV_HOST=127.0.0.1. docs/clamav.md is
# the runbook, including the production layout.
services:
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    ports:
      # Loopback only: clamd has no authentication.
      - "127.0.0.1:3310:3310"
    volumes:
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
      # Signatures survive a restart, so a reboot does not re-download ~300 MB.
      - clamav-db:/var/lib/clamav
    # The bundled freshclam refreshes signatures every 2 hours by default.
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      start_period: 300s
      retries: 3
    mem_limit: 3g

volumes:
  clamav-db:
