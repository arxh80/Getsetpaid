# clamd configuration for GetSetPaid upload scanning (Q42). docs/clamav.md
# explains each choice; the ones that matter for safety are marked FAIL-CLOSED.

Foreground yes
LogTime yes
LogVerbose no
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
# Listen on every interface INSIDE the container; the compose file publishes
# the port on 127.0.0.1 only. clamd has no authentication -- it must never be
# reachable from the internet.
TCPAddr 0.0.0.0

# --- size limits -------------------------------------------------------------
# Uploads are capped at 25 MiB (DOCUMENT_MAX_SIZE_BYTES). clamd's own defaults
# are ALSO 25M, and a file over MaxFileSize is skipped and reported OK -- a
# silent pass. Every limit sits comfortably above the upload cap instead.
StreamMaxLength 30M
MaxFileSize 30M
# docx/xlsx/pptx are zips: the scan size counts the inflated contents.
MaxScanSize 200M

# FAIL-CLOSED: anything that hits a scan limit (a zip bomb, deep nesting, too
# many files) is reported as FOUND (Heuristics.Limits.Exceeded) and so
# quarantined, instead of being passed half-scanned.
AlertExceedsMax yes
# FAIL-CLOSED: an encrypted archive cannot be scanned, so it is not passed.
AlertEncryptedArchive yes

# Office macros are already refused by the allowlist before a scan; flag them
# here too as a second layer.
AlertOLE2Macros yes
# Malformed or broken executables are a red flag in an upload.
AlertBrokenExecutables yes

# The shipped defaults for detection engines, written out so they are visible.
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanArchive yes
Bytecode yes
