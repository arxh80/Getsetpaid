# The first CI this repository has had.
#
# ===========================================================================
# READ THIS BEFORE TRUSTING IT
# ===========================================================================
# THIS FILE'S FIRST THREE RUNS ALL FAILED, and the failure was in this file,
# not in the project. Task 8 wrote it in an environment with no CI runner and
# said so; GitHub then ran it on every Task 8 push -- runs 33304352488,
# 33305110034 and 33305705916 -- and both jobs died in `actions/setup-node`
# before a single gate executed:
#
#   warn: This version of pnpm requires at least Node.js v22.13
#   warn: The current version of Node.js is v20.20.2
#   Error [ERR_UNKNOWN_BUILTIN_MODULE]: No such built-in module: node:sqlite
#
# `packageManager` pins pnpm 11.24.0, which loads `node:sqlite` and therefore
# needs Node >= 22.13; the old `node-version: 20` gave it 20.20.2. Fixed in
# Task 8 fix round 1 by asking for Node 24 (the version this project is
# developed on locally, 24.18.0) in both jobs. The lesson the original header
# was reaching for still stands and is now evidenced: an unexecuted workflow is
# an untested claim.
#
# ===========================================================================
# WHAT IT COVERS, AND THE MUCH LARGER PART IT DOES NOT
# ===========================================================================
# `CLAUDE.md` § Testing gates asks for "dependency and secret scanning in CI".
# There was no CI at all, which is the finding Task 8 raised; this closes the
# smallest honest version of it and NOT the rest:
#
#   COVERED HERE          lint, typecheck, the unit tests, a dependency audit,
#                         a secret scan -- and, since the parallel-stacks
#                         change, the three suites that used to run only on
#                         a developer's machine:
#                         `vitest run tests/integration`, the psql/HTTP
#                         suite, and Playwright. Each is its own job below,
#                         so they run in parallel and a red tick names the
#                         suite without anybody opening a log.
#   NOT COVERED HERE      none of the five documented gates. What is still
#                         missing is a real malware engine
#                         (`SECURITY.md` § 6), a pentest, and any check of
#                         the HOSTED project's configuration
#                         (`SECURITY.md` § 15) -- none of which a CI runner
#                         can do.
#
# ===========================================================================
# WHAT THE THREE HEAVY JOBS COST, STATED RATHER THAN DISCOVERED
# ===========================================================================
# Each of them starts a full local Supabase stack on the runner: eleven
# containers, pulled cold because a runner has no Docker layer cache, then a
# migrate of every file in supabase/migrations. On the developer machine this
# was written on that is about three minutes before a single assertion runs,
# and a hosted runner is slower. Rough per-PR wall clock, jobs in parallel:
#
#   gates          ~3 min      unchanged
#   scan           ~2 min      unchanged
#   integration    ~10 min     stack + `vitest run tests/integration`
#   psql           ~12 min     stack + reset + nineteen psql suites + HTTP
#   e2e            ~25 min     stack + chromium + the whole Playwright suite
#                              on ONE worker (playwright.config.ts pins
#                              workers: 1 -- the fixtures share one stack)
#
# Call it ~50 runner-minutes a pull request against about 5 before. THOSE
# NUMBERS ARE ESTIMATES FROM LOCAL TIMINGS, not measurements of a real run;
# whoever reads the first green run should replace them with what it cost.
# On a private repository this is real money.
#
# The three heavy jobs run on `pull_request` and on pushes to `main`, like
# everything else here -- narrowing them further was considered and is left
# to whoever sees the bill, because a merge to `main` with no PR is exactly
# the case the `push` trigger exists for.
#
# ONE STACK TO A RUNNER, so none of this needs `scripts/stack.mjs`: each job
# owns its machine and takes the committed config.toml's ports unchanged.
# That script exists for a developer machine with several worktrees on it --
# see docs/parallel-stacks.md.
#
# So a green tick is now genuinely the five gates. It is still not a green
# PHASE: nothing here says whether the hosted project's auth settings, its
# MFA hook or its region are configured.
name: CI

# EVERY PR RAN BOTH JOBS TWICE (deferred-minor L1145). `push: ["**"]` fires on
# the branch push and `pull_request` fires on the same commit, so a branch with
# an open PR paid for two identical runs of everything below.
#
# `push` is narrowed to the default branch, which is the one case a PR event
# does not cover -- a merge, or a direct commit to `main`. Feature branches are
# covered by `pull_request`, once.
#
# THE CONSEQUENCE, STATED SO IT IS NOT A SURPRISE: a push to a branch with NO
# open pull request now runs nothing at all. That is the intended trade -- CI
# on a branch nobody has proposed merging is not a gate, it is a bill -- but it
# means "open the PR" is now part of getting a branch checked, and a branch
# worked on for a day before its PR exists has no CI on it until then.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # >= 22.13 IS A HARD FLOOR, NOT A PREFERENCE. `packageManager` pins
          # pnpm 11.24.0, which requires Node >= 22.13 and crashes on
          # `node:sqlite` below it -- that is what killed this workflow's first
          # three runs. 24 is what this project is developed on locally.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # REQUIRED BEFORE `tsc`, AND CI IS THE PLACE IT BITES HARDEST.
      # `PageProps<"/some/route">` and `LayoutProps` are not exported by any
      # package -- Next generates them into `.next/types/` from a route
      # manifest. On a developer's machine `pnpm dev` has already written it;
      # a clean checkout has nothing, so `tsc` reports "Cannot find name
      # 'PageProps'" once per page. That is exactly what this workflow's
      # fourth run did (33308499085), the first run that got far enough to try.
      # `CLAUDE.md` § Current state already tells a human to run this before
      # `pnpm typecheck`.
      - name: Generate Next.js route types
        run: npx next typegen

      # NOT REDUNDANT WITH THE EDITOR. `CLAUDE.md` § Current state: nothing
      # else on a developer's machine runs `tsc`, and the exhaustive `switch`
      # over write outcomes in every Server Action is a compile-time guard
      # only. Skipping typecheck skips those entirely.
      - name: Typecheck
        run: pnpm typecheck

      # UNIT ONLY. `pnpm test` also runs tests/integration, which talks to a
      # real local Supabase stack over HTTP and fails without one. Naming the
      # directory here rather than adding a `--exclude` keeps the failure mode
      # obvious: a new integration test does not silently start being skipped.
      - name: Unit tests
        run: pnpm exec vitest run tests/unit

  scan:
    name: dependency and secret scanning
    runs-on: ubuntu-latest
    # JOB-LEVEL OVERRIDE OF THE WORKFLOW'S `contents: read`. gitleaks-action,
    # on a `pull_request` event, calls `GET /repos/<owner>/<repo>/pulls/<n>/commits`
    # to list the commits it needs to scan, which requires `pull-requests: read`
    # on the job's `GITHUB_TOKEN` -- without it the call 403s with "Resource not
    # accessible by integration" and the Secret scan step fails before it scans
    # anything. Kept job-scoped rather than moved to the workflow level so the
    # `gates` job stays at the narrower `contents: read` from above.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Gitleaks needs history to scan commits, not just the tree. A secret
          # committed and then removed is still a leaked secret.
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # >= 22.13 IS A HARD FLOOR, NOT A PREFERENCE. `packageManager` pins
          # pnpm 11.24.0, which requires Node >= 22.13 and crashes on
          # `node:sqlite` below it -- that is what killed this workflow's first
          # three runs. 24 is what this project is developed on locally.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # HIGH AND ABOVE FAILS. Moderate advisories in a dev-only transitive
      # dependency should not block a branch; a high or critical one should be
      # looked at the day it appears.
      - name: Dependency audit
        run: pnpm audit --audit-level high

      # SECRET SCAN. `CLAUDE.md` § Git workflow: "Never commit secrets, .env
      # files, Supabase service-role keys". The service-role key bypasses RLS
      # entirely (SECURITY.md § 2), so a leaked one is a total tenant breach and
      # not merely an embarrassment.
      #
      # PINNED TO A COMMIT SHA, not to a tag. `@v2` is the moving major and
      # `@v2.3.9` is a tag the publisher can re-point at any time; only a SHA
      # is immutable. An action that scans for secrets is an action with
      # access to every secret in the repository, so this is the one step
      # where a supply-chain swap is worst. Every other `uses:` in this file
      # is pinned the same way for consistency -- SHAs verified against
      # `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` on 2026-08-30, with
      # pnpm/action-setup's annotated tag dereferenced through
      # `git/tags/<sha>`. To bump one: look the new SHA up the same way and
      # update the `# vX.Y.Z` trailer with it.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # LICENCE SCAN (Phase 10 Task 9, G23). Production dependencies only; the
      # allowlist and its one scoped exception live in the script.
      - name: Licence scan
        run: pnpm licenses list --prod --json | node scripts/check-licenses.mjs

      # SAST (Phase 10 Task 9, G24). Semgrep CE, version-pinned. p/default is
      # there because p/typescript and p/react alone miss `eval(req.query.x)`
      # (measured locally, 1.181.1). Excluded with reasons, triaged 2026-10-26:
      # unsafe-formatstring (70 hits, every one a console.* call whose first
      # argument is a template string; the worst case is a garbled log line,
      # no execution), and .superpowers/ (planning and mutation artefacts, not
      # shipped). --error makes any other finding fail the step.
      - name: SAST (Semgrep)
        run: |
          python3 -m pip install --quiet semgrep==1.181.1
          semgrep scan --error --metrics=off \
            --config p/default --config p/typescript --config p/react \
            --exclude-rule javascript.lang.security.audit.unsafe-formatstring.unsafe-formatstring \
            --exclude .superpowers

  # =========================================================================
  # THE THREE STACK JOBS.
  #
  # Each one is the same four steps -- checkout, pnpm+node, the Supabase CLI,
  # `supabase start` -- and then one suite. They are separate jobs rather than
  # steps of one job on purpose: they parallelise, and a red tick names the
  # suite that failed without anybody opening a log.
  #
  # The CLI is PINNED to 2.116.0, the version this project is developed
  # against. `latest` would mean a CLI release could turn a green branch red
  # with no commit of ours, and config.toml's schema is versioned with the CLI.
  # =========================================================================
  integration:
    name: integration tests (real stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      # `supabase start` applies every migration on a fresh stack, so there is
      # no separate reset here. It is the slow step: eleven container images
      # pulled cold on a runner with no layer cache, then the migrate.
      - name: Start Supabase
        run: supabase start

      # tests/integration/rls/support/env.ts shells out to
      # `supabase status -o json` and REFUSES to run against anything but a
      # loopback API -- it creates and deletes real auth users. That refusal is
      # why no hosted credential is needed, or wanted, in this job.
      - name: Integration tests
        run: pnpm exec vitest run tests/integration

      - name: Supabase state on failure
        if: failure()
        run: docker ps -a && docker logs supabase_db_getsetpaid --tail 200

  psql:
    name: psql + HTTP RLS suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      # run-rls-tests.sh parses JSON with `python -c`, not `python3`. The runner
      # image ships python3 and does not guarantee the bare name, and a missing
      # interpreter here surfaces as "Could not read SERVICE_ROLE_KEY ... Is the
      # local stack up?", which sends the reader to fix the wrong thing.
      - name: Ensure `python` resolves
        run: sudo ln -sf "$(command -v python3)" /usr/local/bin/python

      - name: Start Supabase
        run: supabase start

      # The suite REFUSES to run against a non-empty public schema (its own
      # preflight) and is not idempotent. A fresh `supabase start` is already
      # empty; the reset is here because it is what the documented recipe says
      # and it is a cheap no-op on a clean stack.
      - name: Reset the database
        run: supabase db reset

      - name: RLS / tenant-boundary suite
        run: bash supabase/tests/run-rls-tests.sh

      - name: Supabase state on failure
        if: failure()
        run: docker ps -a && docker logs supabase_db_getsetpaid --tail 200

  e2e:
    name: Playwright (golden paths, tenant breakout, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium is ~150 MB and only changes when @playwright/test does, so the
      # lockfile hash is the right key. A miss costs the download below; a hit
      # costs nothing.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` installs the shared libraries a headless Chromium needs on
      # a bare runner -- which is why the local prerequisite in CLAUDE.md is the
      # shorter `npx playwright install chromium`. Run even on a cache hit: the
      # apt packages are not in that cache.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      - name: Start Supabase
        run: supabase start

      # Playwright starts its OWN dev server (reuseExistingServer is false
      # unless PLAYWRIGHT_REUSE_SERVER=1, deliberately -- see that config's
      # header), and `pnpm dev` runs scripts/dev.mjs, which refuses to start
      # unless the stack above is up. So there is no readiness race to paper
      # over here.
      - name: E2E suite
        run: pnpm test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Supabase state on failure
        if: failure()
        run: docker ps -a && docker logs supabase_db_getsetpaid --tail 200
