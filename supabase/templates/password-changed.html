<!--
  "Your password has been changed" notification.

  NOT COSMETIC, and not a courtesy. This is the mitigation named in
  lib/auth/step-up.ts: the application cannot detect whether an account already
  has a password (GoTrue overwrites the empty hash the moment an invitee
  confirms), so a session that just consumed a fresh emailed link is allowed to
  set one. That is no weaker than the recovery flow the product already offers
  — but it must not be SILENT. This email is what turns a change the account
  holder did not make into something they find out about.

  It therefore carries no link and asks for no action: a notification that
  contains a clickable "secure your account" button is a phishing template
  waiting to be copied. It states what happened and where to go.

  Inline styles and longhand hex: email clients have no access to our design
  tokens. See the note in invite.html.
-->
<div style="font-family: Georgia, 'Times New Roman', serif; color: #14141C; background: #FFF4F4; padding: 32px;">
  <div style="max-width: 480px; margin: 0 auto; background: #FFFFFF; border: 1px solid #D6CBCB; padding: 32px;">
    <p style="margin: 0 0 24px; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: #55555F;">
      GetSetPaid
    </p>

    <h1 style="margin: 0 0 16px; font-size: 25px; line-height: 32px; font-weight: 800;">
      Your password was changed
    </h1>

    <p style="margin: 0 0 24px; font-size: 15px; line-height: 24px;">
      The password on the GetSetPaid account for
      <strong style="font-weight: 700;">{{ .Email }}</strong> has just been set
      or changed.
    </p>

    <p style="margin: 0; font-size: 15px; line-height: 24px;">
      If that was you, there's nothing to do. If it wasn't, sign in and change
      your password immediately, then contact us.
    </p>
  </div>
</div>
