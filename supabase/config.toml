# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "getsetpaid"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. `public` and `graphql_public` schemas are included by default.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000
# Controls whether new tables, views, sequences and functions created in the `public` schema by
# `postgres` are reachable through the Data API roles (`anon`, `authenticated`, `service_role`)
# without explicit GRANTs. When unset, new entities are NOT auto-exposed, matching the new cloud
# default. Set to `true` to keep the legacy behaviour of auto-exposing new entities; this is
# deprecated and the field is removed on 2026-10-30 once the always-revoked behaviour is permanent.
# auto_expose_new_tables = true

[api.tls]
# Enable HTTPS endpoints locally using a self-signed certificate.
enabled = false
# Paths to self-signed certificate pair.
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# Maximum amount of time to wait for health check when starting the local database.
health_timeout = "2m"
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 17

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# If disabled, migrations will be skipped during a db push or reset.
enabled = true
# Specifies an ordered list of schema files that describe your database.
# Supports glob patterns relative to supabase directory: "./schemas/*.sql"
schema_paths = []

[db.seed]
# If enabled, seeds the database after migrations during a db reset.
enabled = true
# Specifies an ordered list of seed files to load during db reset.
# Supports glob patterns relative to supabase directory: "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[db.network_restrictions]
# Enable management of network restrictions.
enabled = false
# List of IPv4 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv4 connections. Set empty array to block all IPs.
allowed_cidrs = ["0.0.0.0/0"]
# List of IPv6 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv6 connections. Set empty array to block all IPs.
allowed_cidrs_v6 = ["::/0"]

# Uncomment to reject non-secure connections to the database.
# [db.ssl_enforcement]
# enabled = true

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv4)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[local_smtp]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

# Uncomment to configure local storage buckets
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"

# Allow connections via S3 compatible clients
[storage.s3_protocol]
enabled = true

# Image transformation API is available to Supabase Pro plan.
# [storage.image_transformation]
# enabled = true

# Store analytical data in S3 for running ETL jobs over Iceberg Catalog
# This feature is only available on the hosted platform.
[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

# Analytics Buckets is available to Supabase Pro plan.
# [storage.analytics.buckets.my-warehouse]

# Store vector embeddings in S3 for large and durable datasets
[storage.vector]
enabled = true
max_buckets = 10
max_indexes = 5

# Vector Buckets is available to Supabase Pro plan.
# [storage.vector.buckets.documents-openai]

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
# NOTE: `supabase config push` applies this file to the LINKED HOSTED project,
# so site_url is not a local-only setting -- it is the base every auth email
# (magic link, invite, confirmation, password reset) is built from. A localhost
# value here means a hosted user receives a link pointing at their own machine.
# Change this to the deployed origin as part of the first real deployment; it is
# on the SECURITY.md § 15 pre-launch checklist for that reason.
site_url = "http://localhost:3000"
# The public URL that Auth serves on. Defaults to the API external URL with `/auth/v1` appended.
# external_url = ""
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
# Both loopback spellings are listed because they are different origins to the
# browser and to GoTrue's allow-list: a redirect to localhost is NOT matched by
# a 127.0.0.1 entry. Scheme is http -- local dev does not serve TLS, and an
# https entry here silently matches nothing.
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
#
# LOWERED FROM THE CLI DEFAULT (3600) AS PART OF TASK 7, and the reason is
# precise rather than "shorter is safer": [auth.sessions] timebox and
# inactivity_timeout below genuinely invalidate a session's REFRESH TOKEN
# server-side (verified empirically -- methodology and full results are in
# tests/integration/session/session-limits.test.ts, summarised in
# lib/auth/idle-timeout.ts's header), but that invalidation is only checked
# when a refresh is actually ATTEMPTED. An access token already in a
# browser's cookies keeps authenticating successfully -- signature + exp
# only, no per-request auth.sessions lookup -- for the rest of ITS OWN
# lifetime regardless of what happened to the session server-side in the
# meantime (verified: GET /auth/v1/user with a still-live access token
# returned 200 for a session already rejected at
# /auth/v1/token?grant_type=refresh_token). So the true worst-case lag between
# "GoTrue invalidated this session" and "this app actually stops honouring it"
# is bounded by THIS number, not by timebox/inactivity_timeout themselves.
# 900s (15 min) keeps that lag small without materially increasing refresh
# traffic (well inside auth.rate_limit.token_refresh = 150/5min/IP).
#
# DEPLOYMENT NOTE (fix round 1, Important 5): this file governs the LOCAL CLI
# stack only. It is not pushed to a hosted Supabase project automatically,
# and nothing in this repo does so today -- the entire justification above is
# a PRODUCTION concern (bounding a real access-token-outlives-its-session
# window), so it is a release-blocking checklist item, not a local-dev nicety,
# to set jwt_expiry = 900 (or lower) on the hosted project's Auth settings
# before launch, alongside the [auth.sessions] timebox/inactivity_timeout
# values and [auth.mfa.totp] enroll_enabled/verify_enabled below. Whoever
# provisions the hosted project should treat this whole file as the
# source-of-truth checklist for that step, not just a local default.
jwt_expiry = 900
# JWT issuer URL. If not set, defaults to auth.external_url.
# jwt_issuer = ""
# Path to JWT signing key. DO NOT commit your signing keys file to git.
# signing_keys_path = "./signing_keys.json"
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
enable_signup = true
# Allow/disallow anonymous sign-ins to your project.
enable_anonymous_sign_ins = false
# Allow/disallow testing manual linking of accounts
enable_manual_linking = false
# Passwords shorter than this value will be rejected as weak. Minimum 6, recommended 8 or more.
#
# MUST STAY IN STEP WITH MIN_PASSWORD_LENGTH IN lib/forms.ts. This was the CLI
# default of 6 while the application asked for 10, and the two are not
# equivalent protections: GoTrue's endpoints are directly reachable with the
# anon key, so a 6-character password could be set out-of-band and the
# app-level check skipped entirely. CLAUDE.md § Permissions: "enforced
# server-side -- hiding UI is not enforcement", and the app's own validator is
# UI as far as the auth server is concerned. lib/forms.ts keeps the friendlier
# message; this is the line that actually holds.
minimum_password_length = 10
# Passwords that do not meet the following requirements will be rejected as weak. Supported values
# are: `letters_digits`, `lower_upper_letters_digits`, `lower_upper_letters_digits_symbols`
password_requirements = ""

# Configure passkey sign-ins.
# [auth.passkey]
# enabled = false

# Configure WebAuthn relying party settings (required when passkey is enabled).
# [auth.webauthn]
# rp_display_name = "Supabase"
# rp_id = "localhost"
# rp_origins = ["http://127.0.0.1:3000"]

[auth.rate_limit]
# Number of emails that can be sent per hour. Requires auth.email.smtp to be enabled.
#
# Raised from the CLI default of 2. Two auth emails per hour PER PROJECT (not
# per user) makes the invite flow unusable the moment an organisation onboards
# more than one colleague in a sitting -- the third invite silently fails to
# send while the membership row is created, leaving an invitee who can never
# accept. 30/hour is a working figure for local development and small-team
# onboarding; the real production ceiling belongs with the transactional email
# provider once one is chosen, alongside the per-user application rate limits
# in SECURITY.md § 5.
email_sent = 30
# Number of SMS messages that can be sent per hour. Requires auth.sms to be enabled.
sms_sent = 30
# Number of anonymous sign-ins that can be made per hour per IP address. Requires enable_anonymous_sign_ins = true.
anonymous_users = 30
# Number of sessions that can be refreshed in a 5 minute interval per IP address.
token_refresh = 150
# Number of sign up and sign-in requests that can be made in a 5 minute interval per IP address (excludes anonymous users).
sign_in_sign_ups = 30
# Number of OTP / Magic link verifications that can be made in a 5 minute interval per IP address.
token_verifications = 30
# Number of Web3 logins that can be made in a 5 minute interval per IP address.
web3 = 30

# Configure one of the supported captcha providers: `hcaptcha`, `turnstile`.
# [auth.captcha]
# enabled = true
# provider = "hcaptcha"
# secret = ""

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
#
# ON SINCE PHASE 10 TASK 4, AND IT IS A SECURITY CONTROL (G11 in
# docs/launch-gates.md). With it off, anyone could sign up as an address they
# do not own and hold a confirmed, usable account at once -- and a workspace
# that later invited that address bound the invitation to the squatter's
# account (reproduced through the real forms before this change). With it on,
# an account's address means "the holder of this inbox": accept_invite()
# refuses an unconfirmed account (20261102010000), and the invite step refuses
# to bind an existing unconfirmed sign-up (lib/org/actions.ts). Asserted by
# tests/unit/security/auth-config.test.ts, and on the SECURITY.md § 15
# checklist for the hosted project ("Confirm email" ON). Changing it needs a
# `supabase stop && supabase start`: a `db reset` restarts the auth container
# with its old environment.
enable_confirmations = true
# If enabled, users will need to reauthenticate or have logged in recently to change their password.
#
# ON AS A BACKSTOP, NOT AS THE GATE. Read GoTrue's actual rule before relying
# on it: it only demands a reauthentication nonce when the session is more than
# 24 HOURS old. Our absolute session lifetime is 12 hours ([auth.sessions]
# timebox below), so that branch can never fire here -- which is why turning
# this on is not, by itself, an answer to "a stale session must not be able to
# change a password". The real gate is passwordChangeGate() in
# lib/auth/actions.ts: a credential-method authentication within five minutes,
# or a single-use emailed token within thirty (lib/auth/step-up.ts). This flag
# is set so the intent is recorded at the auth server too, and so it starts
# protecting if timebox is ever widened past 24h. Verified it breaks neither
# password path: an invitee setting a first password and an existing user
# changing theirs both still succeed.
secure_password_change = true
# Controls the minimum amount of time that must pass before sending another signup confirmation or password reset email.
max_frequency = "1s"
# Number of characters used in the email OTP.
otp_length = 6
# Number of seconds before the email OTP expires (defaults to 1 hour).
otp_expiry = 3600

# Use a production-ready SMTP server
# [auth.email.smtp]
# enabled = true
# host = "smtp.sendgrid.net"
# port = 587
# user = "apikey"
# pass = "env(SENDGRID_API_KEY)"
# admin_email = "admin@email.com"
# sender_name = "Admin"

# Custom email templates. THESE ARE NOT COSMETIC -- read supabase/templates/
# invite.html before changing either of them.
#
# GoTrue's stock templates use {{ .ConfirmationURL }}, which routes through
# /auth/v1/verify and hands the session back in a URL FRAGMENT
# (#access_token=...). Fragments are never sent to the server, so our
# server-side /auth/callback route cannot read one -- supabase-js documents
# that "PKCE is not supported when using inviteUserByEmail", and this is the
# consequence. Both templates below use {{ .TokenHash }} against our own
# callback instead, which completes the exchange with verifyOtp() on the
# server and keeps auth tokens out of the browser's URL, history and Referer.
[auth.email.template.invite]
subject = "You've been invited to a GetSetPaid workspace"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your GetSetPaid sign-in link"
content_path = "./supabase/templates/magic-link.html"

# Phase 10 Task 20 (Q245): sign-up confirmations and recovery links go
# through /auth/callback with a token hash, so the first proof of an address
# always reaches lib/auth/first-proof.ts. The hosted dashboard needs the same
# two templates pasted in (SECURITY.md § 15).
[auth.email.template.confirmation]
subject = "Confirm your GetSetPaid email address"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your GetSetPaid password"
content_path = "./supabase/templates/recovery.html"

# Password-change notification. ON DELIBERATELY, and intended as a security
# control rather than a nicety.
#
# lib/auth/step-up.ts explains why: the application cannot tell whether an
# account already has a password (GoTrue replaces the empty hash with a bcrypt
# of a random value the moment an invitee confirms, so the column reads "has a
# password" for a user who has none). The gate therefore accepts a freshly
# consumed one-time emailed link as proof for setting a password -- no weaker
# than the recovery flow, but it should not be SILENT. This notification is
# what would make an unexpected change visible to the account holder.
#
# VERIFIED WORKING LOCALLY since Supabase CLI 2.116 (Phase 10 Task 2, F3): the
# CLI passes these blocks to GoTrue (GOTRUE_MAILER_NOTIFICATIONS_*_ENABLED in
# the auth container's environment), and
# tests/integration/session/security-notifications.test.ts changes a password
# and enrols and removes a TOTP factor straight through GoTrue, as a stolen
# token would, and reads each notice out of Mailpit. CLI 2.108 accepted the
# block but did not pass it on. The two MFA notifications below are the same
# control for the other half of F3: GoTrue lets an aal2 session enrol a new
# factor and remove the holder's with no step-up, and nothing configurable in
# the pinned toolchain stops it (SECURITY.md § 4), so it must at least not be
# silent. The hosted project needs all three switched on (SECURITY.md § 15).
# Asserted by tests/unit/security/auth-config.test.ts. A change here needs
# `supabase stop && supabase start`; a `db reset` keeps the old environment.
[auth.email.notification.password_changed]
enabled = true
subject = "Your GetSetPaid password was changed"
# NOTE the different base directory from [auth.email.template.*] above, which
# take "./supabase/templates/...". The CLI resolves notification templates
# relative to supabase/ itself, and a path with the extra segment fails the
# config load outright ("open supabase\supabase\templates\..."). Not a typo.
content_path = "./templates/password-changed.html"

[auth.email.notification.mfa_factor_enrolled]
enabled = true
subject = "A sign-in factor was added to your GetSetPaid account"
content_path = "./templates/mfa-factor-enrolled.html"

[auth.email.notification.mfa_factor_unenrolled]
enabled = true
subject = "A sign-in factor was removed from your GetSetPaid account"
content_path = "./templates/mfa-factor-unenrolled.html"

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = false
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false
# Template for sending OTP to users
template = "Your code is {{ `{{ .Code }}` }}"
# Controls the minimum amount of time that must pass before sending another sms otp.
max_frequency = "5s"

# Use pre-defined map of phone number to OTP for testing.
# [auth.sms.test_otp]
# 4152127777 = "123456"

# Session limits. These are the values CLAUDE.md § Session security signed off
# on, enforced by the auth server rather than by application code:
#   "Inactivity timeout 30 minutes; absolute max session lifetime 12 hours."
# An app-side timer would only control what the UI shows; timebox and
# inactivity_timeout invalidate the refresh token itself.
#
# TASK 7 RE-VERIFIED THIS CLAIM AGAINST THE RUNNING STACK rather than taking
# it on faith, and it holds -- with two nuances the sentence above doesn't
# capture, both empirically confirmed and both accounted for elsewhere rather
# than silently ignored. Full methodology and results are in
# tests/integration/session/session-limits.test.ts (an automated, real-stack
# regression suite -- not just a one-off manual check) and summarised in
# lib/auth/idle-timeout.ts's header comment:
#
#   1. inactivity_timeout is skipped entirely on a session's FIRST-EVER
#      refresh (its `refreshed_at` row starts NULL and the inactivity
#      comparison only runs once that column is set) -- so a session that is
#      abandoned before it ever needs to refresh is NOT caught by this alone,
#      no matter how long it sits idle, up to the 12h timebox. Closed by
#      components/auth/idle-timeout.tsx, which is genuine enforcement (it
#      calls supabase.auth.signOut(), revoking the refresh token) rather than
#      pure UX, precisely because of this gap.
#   2. Both limits are enforced at REFRESH time, not on every request -- an
#      access token already issued keeps authenticating for the rest of its
#      own jwt_expiry above regardless of session state. See the jwt_expiry
#      comment for why that value was lowered because of this.
[auth.sessions]
timebox = "12h"
inactivity_timeout = "30m"

# This hook runs before a new user is created and allows developers to reject the request based on the incoming user object.
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/auth/before-user-created-hook"

# This hook runs before a token is issued and allows you to add additional claims based on the authentication method used.
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

# THE PER-ACCOUNT HALF OF SECURITY.md § 5's LOGIN ROW (Phase 7 Task 5).
# GoTrue calls public.hook_password_verification_attempt (migration
# 20260909020000) on every password check; the function counts FAILED
# attempts per account in public.rate_limit_counters (5 per 15-minute fixed
# window), rejects every attempt while the budget is spent, resets on a
# successful sign-in, and files a repeated_login_failures incident alert at
# the exactly-once crossing. The per-IP half stays GoTrue's own
# sign_in_sign_ups limit above -- see SECURITY.md § 5 for the honest
# per-row status. ON HOSTED SUPABASE THIS HOOK MUST BE ENABLED IN THE
# DASHBOARD TOO (SECURITY.md § 15's pre-launch checklist): config.toml only
# configures the local stack, and a hook that is not enabled is a limit that
# does not exist.
[auth.hook.password_verification_attempt]
enabled = true
uri = "pg-functions://postgres/public/hook_password_verification_attempt"

# Configure one of the supported SMS providers: `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# DO NOT commit your Twilio auth token to git. Use environment variable substitution instead:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Multi-factor-authentication is available to Supabase Pro plan.
[auth.mfa]
# Control how many MFA factors can be enrolled at once per user.
max_enrolled_factors = 10

# Control MFA via App Authenticator (TOTP)
#
# ENABLED FOR TASK 7. CLAUDE.md § Session security: "MFA is required for:
# Platform Superuser, Organisation Owner, Admin, Finance." That requirement is
# unimplementable while GoTrue itself refuses every enroll()/verify() call --
# lib/auth/mfa-gate.ts and components/auth/mfa-enroll-gate.tsx need a real
# TOTP factor to enroll and verify against, not a mock.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Configure MFA via Phone Messaging
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ `{{ .Code }}` }}"
max_frequency = "5s"

# Configure MFA via WebAuthn
# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `x`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
# DO NOT commit your OAuth provider secret to git. Use environment variable substitution instead:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Overrides the default auth callback URL derived from auth.external_url.
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""
# If enabled, the nonce check will be skipped. Required for local sign in with Google auth.
skip_nonce_check = false
# If enabled, it will allow the user to successfully authenticate when the provider does not return an email address.
email_optional = false

# Google SSO. CLAUDE.md § Session security: "Google sign-in ships at MVP ...
# Microsoft SSO is post-MVP."
#
# CREDENTIALS ARE NOT PROVISIONED YET. Creating the Google Cloud OAuth client
# is a founder action tracked as an open decision, so both values below resolve
# from environment variables that are currently unset. `enabled = true` with
# empty credentials means the provider is wired but any attempt fails at
# Google's end -- which is the honest state, and is why this task could not
# verify an end-to-end Google login.
#
# THESE ARE READ BY THE SUPABASE AUTH SERVER, NOT BY THE NEXT.JS APP. No
# application code reads GOOGLE_OAUTH_CLIENT_ID or _SECRET; the app only calls
# signInWithOAuth({ provider: 'google' }). That is why neither is NEXT_PUBLIC_
# and why the secret never enters the repo -- config.toml's env() substitution
# resolves them at container start.
#
# Authorised redirect URI to register with Google:
#   http://127.0.0.1:54321/auth/v1/callback   (local)
# GoTrue then forwards to our own /auth/callback with a ?code= to exchange.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
# DO NOT commit the secret. Environment variable substitution only.
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
redirect_uri = ""
url = ""
# Local sign-in with Google requires the nonce check to be skipped; leave this
# false for hosted environments.
skip_nonce_check = false

# Allow Solana wallet holders to sign in to your project via the Sign in with Solana (SIWS, EIP-4361) standard.
# You can configure "web3" rate limit in the [auth.rate_limit] section and set up [auth.captcha] if self-hosting.
[auth.web3.solana]
enabled = false

# Use Firebase Auth as a third-party provider alongside Supabase Auth.
[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

# Use Auth0 as a third-party provider alongside Supabase Auth.
[auth.third_party.auth0]
enabled = false
# tenant = "my-auth0-tenant"
# tenant_region = "us"

# Use AWS Cognito (Amplify) as a third-party provider alongside Supabase Auth.
[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

# Use Clerk as a third-party provider alongside Supabase Auth.
[auth.third_party.clerk]
enabled = false
# Obtain from https://clerk.com/setup/supabase
# domain = "example.clerk.accounts.dev"

# OAuth server configuration
[auth.oauth_server]
# Enable OAuth server functionality
enabled = false
# Path for OAuth consent flow UI
authorization_url_path = "/oauth/consent"
# Allow dynamic client registration
allow_dynamic_registration = false

[edge_runtime]
enabled = true
# Supported request policies: `oneshot`, `per_worker`.
# `per_worker` (default) — enables hot reload during local development.
# `oneshot` — fallback mode if hot reload causes issues (e.g. in large repos or with symlinks).
policy = "per_worker"
# Port to attach the Chrome inspector for debugging edge functions.
inspector_port = 8083
# The Deno major version to use.
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

[analytics]
enabled = true
port = 54327
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# Experimental features may be deprecated any time
[experimental]
# Configures Postgres storage engine to use OrioleDB (S3)
orioledb_version = ""
# Configures S3 bucket URL, eg. <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configures S3 bucket region, eg. us-east-1
s3_region = "env(S3_REGION)"
# Configures AWS_ACCESS_KEY_ID for S3 bucket
s3_access_key = "env(S3_ACCESS_KEY)"
# Configures AWS_SECRET_ACCESS_KEY for S3 bucket
s3_secret_key = "env(S3_SECRET_KEY)"

# pg-delta is the schema diff engine for db diff / db pull / db remote commit.
# Set enabled = false to fall back to the legacy migra engine.
[experimental.pgdelta]
enabled = true
# Directory under `supabase/` where declarative files are written.
# declarative_schema_path = "./database"
# JSON string passed through to pg-delta SQL formatting.
# format_options = "{\"keywordCase\":\"upper\",\"indent\":2,\"maxWidth\":80,\"commaStyle\":\"trailing\"}"
